<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Veterans in Tech Summit</title>
    <link href="resources/css/style.css" type="text/css" rel="stylesheet">
</head>

<body>

    <section class="registration-container">
        <h1>Secure your Mission Slot</h1>
        <p>Join fellow veterans in Greensboro for three days of networking and skill-building.</p>

        <form action="#" class="reg-form">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Military/Work Email</label>
            <input type="email" id="email" name="email" required>

            <label for="branch">Branch of Service</label>
            <select id="branch" name="branch">
                <option value="army">Army / ARNG</option>
                <option value="navy">Navy</option>
                <option value="airforce">Air Force</option>
                <option value="marines">Marines</option>
                <option value="coastguard">Coast Guard</option>
            </select>

            <label for="interest">Primary Tech Interest</label>
            <input type="text" id="intereset" name="interest" placeholder="e.g., Data Science, DevOps, Cybersecurity">

            <button type="submit" class="submit-btn">Complete Registration</button>
        </form>
        <a href="conference.html" class="back-link">← Return to Summit Details</a>
    </section>
    <footer>
        <p>&copy; Veterans in Tech Summit 2026</p>
        <div class="social-links">
            <a href="#">Instagram</a>
            <a href="#">YouTube</a>
            <a href="#">Twitter</a>
        </div>
    </footer>
</body>

</html>
